name: Disparador de Notificaciones (Cron)

on:
  schedule:
    # Se ejecuta cada 30 minutos
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub si querés probarlo

jobs:
  ping-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de notificaciones
        run: |
          curl -X GET "https://app-horarios-mu.vercel.app/api/bot/cron" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
